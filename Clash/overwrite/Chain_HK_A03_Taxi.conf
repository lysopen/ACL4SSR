[Overwrite]
#!NAME = Chain_HK_A03_Taxi
#!DESC = 香港A03前置到Taxi9929，复用转换结果中的订阅，不修改原节点。需配套链式测试INI。
#!CONFIG = /etc/openclash/config/chain-hk-a03-taxi-test.yaml
# 从前置组使用的 provider 复制订阅定义。只为新 provider 加入筛选、独立缓存路径和链式覆写。
ruby_edit "$CONFIG_FILE" "['proxy-providers']['taxi-via-hk-a03']" "lambda { |source| source.merge('path'=>'./proxy_provider/taxi-via-hk-a03.yaml', 'filter'=>'^VPS-Taxi-LA-9929-5y1mzbjqqb$', 'override'=>(source['override'] || {}).merge('dialer-proxy'=>'链式前置·香港A03', 'additional-prefix'=>'⛓ ')) }.call(Value['proxy-providers'].fetch(Value['proxy-groups'].find { |group| group['name']=='链式前置·香港A03' }.fetch('use').first))"
